<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pv-vault" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="pv-core" x1="8" y1="7" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Vault Shell -->
  <path
    d="M16 2L28 9V23L16 30L4 23V9L16 2Z"
    fill="url(#pv-vault)"
    fill-opacity="0.25"
    stroke="url(#pv-vault)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Inner Vault Chamber -->
  <path
    d="M16 7L24 11.5V20.5L16 25L8 20.5V11.5L16 7Z"
    fill="url(#pv-core)"
    stroke="#818CF8"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Terminal Command Prompt Indicator (> _) -->
  <path
    d="M12 14L15.5 16L12 18"
    stroke="#A5B4FC"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <line
    x1="17.5"
    y1="18"
    x2="20.5"
    y2="18"
    stroke="#38BDF8"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
